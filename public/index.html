function syncSuccessDialog() {
  const isSuccess = state.mode === 'room' && state.room && state.room.status === 'success';

  if (!isSuccess) {
    if (successDialog.open) successDialog.close();
    return;
  }

  successDialogBody.innerHTML = successDialogMarkup();

  const key = successKey(state.room);
  if (key && state.dismissedSuccessKey !== key && !successDialog.open) {
    openSuccessDialog();
  }
}

function openSuccessDialog() {
  if (!successDialog || typeof successDialog.showModal !== 'function') return;
  try {
    if (!successDialog.open) successDialog.showModal();
    launchConfetti();
  } catch (error) {
    /* 不支持 showModal 的环境仍然能看到成功页面 */
  }
}

function closeSuccessDialog(markDismissed) {
  if (markDismissed !== false && state.room && state.room.status === 'success') {
    state.dismissedSuccessKey = successKey(state.room);
  }
  if (successDialog.open) successDialog.close();
}

function launchConfetti() {
  if (!confettiField) return;
  confettiField.innerHTML = '';
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }

  const colors = ['#e2a08e', '#f1c9bf', '#a9c5b7', '#f0dda7', '#cbb9da', '#d98a76'];
  const pieces = [];
  for (let i = 0; i < 30; i += 1) {
    const left = Math.random() * 100;
    const delay = Math.random() * 0.55;
    const duration = 2.3 + Math.random() * 1.8;
    const drift = Math.random() * 160 - 80;
    const rotation = Math.random() * 720 - 360;
    const width = 5 + Math.random() * 7;
    const height = 8 + Math.random() * 10;
    const color = colors[Math.floor(Math.random() * colors.length)];
    pieces.push(
      '<i style="' +
      '--left:' + left.toFixed(2) + '%;' +
      '--delay:' + delay.toFixed(2) + 's;' +
      '--duration:' + duration.toFixed(2) + 's;' +
      '--drift:' + drift.toFixed(1) + 'px;' +
      '--rot:' + rotation.toFixed(0) + 'deg;' +
      '--color:' + color + ';' +
      'width:' + width.toFixed(1) + 'px;' +
      'height:' + height.toFixed(1) + 'px;' +
      '"></i>'
    );
  }
  confettiField.innerHTML = pieces.join('');
}

/* ============================================================
   11. 确认弹窗
   ============================================================ */
function openConfirm(config) {
  confirmTitle.textContent = config.title || '确认一下';
  confirmText.textContent = config.message || '';
  confirmOk.textContent = config.confirmLabel || '确认';
  pendingConfirm = typeof config.onConfirm === 'function' ? config.onConfirm : null;

  if (typeof confirmDialog.showModal === 'function') {
    if (!confirmDialog.open) confirmDialog.showModal();
  } else if (window.confirm((config.title || '确认一下') + '\n\n' + (config.message || ''))) {
    const action = pendingConfirm;
    pendingConfirm = null;
    if (action) action();
  }
}

/* ============================================================
   12. 渲染
   ============================================================ */
function screenName() {
  if (state.mode === 'server-required') return 'server-required';
  if (state.mode === 'restoring') return 'restoring';
  if (state.mode === 'join') return 'join';
  if (state.mode === 'missing') return 'missing';
  if (state.mode === 'room' && state.room) {
    if (state.room.status === 'success') return 'success';
    if (state.room.playersCount < 2 || state.room.status === 'waiting') return 'waiting';
    return 'game';
  }
  return 'home';
}

function screenKeyFor() {
  const name = screenName();
  if (name === 'game' && state.room && state.room.current) {
    const current = state.room.current;
    const phase = current.bothSubmitted && current.myWord !== current.partnerWord ? 'vote' : 'input';
    return 'game:' + current.round + ':' + phase;
  }
  if (name === 'success' && state.room) {
    return 'success:' + (finalEntry(state.room) ? finalEntry(state.room).round : 0);
  }
  if (name === 'waiting' && state.room) {
    return 'waiting:' + state.room.playersCount;
  }
  return name;
}

function render() {
  const activeElement = document.activeElement;
  const activeId = activeElement && activeElement.id ? activeElement.id : '';
  const selectionStart =
    activeElement && typeof activeElement.selectionStart === 'number'
      ? activeElement.selectionStart
      : null;
  const selectionEnd =
    activeElement && typeof activeElement.selectionEnd === 'number'
      ? activeElement.selectionEnd
      : null;

  const name = screenName();
  let content = '';
  let mainClass = 'main';

  if (name === 'home') {
    content = homeMarkup();
    mainClass += ' home-main';
  } else if (name === 'join') {
    content = joinMarkup();
    mainClass += ' join-main';
  } else if (name === 'waiting') {
    content = waitingMarkup();
    mainClass += ' room-main';
  } else if (name === 'game') {
    content = gameMarkup();
    mainClass += ' game-main';
  } else if (name === 'success') {
    content = successMarkup();
    mainClass += ' success-main';
  } else if (name === 'missing') {
    content = missingMarkup();
    mainClass += ' empty-main';
  } else if (name === 'restoring') {
    content = restoringMarkup();
    mainClass += ' empty-main';
  } else {
    content = serverRequiredMarkup();
    mainClass += ' empty-main';
  }

  app.innerHTML = [
    topbarMarkup(),
    '<main class="' + mainClass + '" id="mainContent">',
    content,
    '</main>',
    footerMarkup()
  ].join('');

  const newKey = screenKeyFor();
  const shouldScroll = Boolean(state.screenKey && state.screenKey !== newKey);
  state.screenKey = newKey;

  syncComposerState();

  if (activeId) {
    const focusElement = document.getElementById(activeId);
    if (focusElement && typeof focusElement.focus === 'function') {
      focusElement.focus({ preventScroll: true });
      if (
        selectionStart !== null &&
        typeof focusElement.setSelectionRange === 'function'
      ) {
        try {
          focusElement.setSelectionRange(selectionStart, selectionEnd);
        } catch (error) {
          /* 某些输入类型不支持选区，忽略 */
        }
      }
    }
  }

  syncSuccessDialog();
  focusAfterRender();

  if (shouldScroll) {
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
}

function syncComposerState() {
  const wordInput = document.getElementById('wordInput');
  if (!wordInput) return;
  const count = charLength(wordInput.value);
  const countEl = document.getElementById('wordCount');
  const submitButton = document.querySelector('[data-word-submit]');
  if (countEl) {
    countEl.textContent = count + ' / ' + MAX_WORD_LENGTH;
    countEl.classList.toggle('is-over', count > MAX_WORD_LENGTH);
  }
  if (submitButton) {
    submitButton.disabled = !cleanWord(wordInput.value) || !isSocketOpen();
  }
}

/* ============================================================
   13. 事件
   ============================================================ */
document.addEventListener('click', function (event) {
  const trigger = event.target.closest('[data-action]');
  if (!trigger) return;
  const action = trigger.dataset.action;
  if (!action) return;

  if (action === 'create-room') {
    createRoom();
  } else if (action === 'open-join') {
    openJoin();
  } else if (action === 'go-home') {
    goHome();
  } else if (action === 'copy-code') {
    if (state.room) copyText(state.room.code);
  } else if (action === 'copy-link') {
    if (state.room) copyText(buildShareLink(state.room.code));
  } else if (action === 'vote') {
    castVote(trigger.dataset.vote, trigger.dataset.round);
  } else if (action === 'rematch') {
    requestRematch();
  } else if (action === 'request-exit') {
    requestExit();
  } else if (action === 'dismiss-success') {
    closeSuccessDialog(true);
  } else if (action === 'reconnect') {
    reconnectNow();
  } else if (action === 'abandon-restore') {
    abandonRestore();
  }
});

app.addEventListener('submit', function (event) {
  const form = event.target.closest('form[data-form]');
  if (!form) return;
  event.preventDefault();

  if (form.dataset.form === 'join') {
    const input = form.querySelector('#joinCode');
    if (input) state.joinDraft = input.value;
    joinRoom();
  } else if (form.dataset.form === 'word') {
    const input = form.querySelector('#wordInput');
    submitWord(input ? input.value : '');
  }
});

app.addEventListener('input', function (event) {
  const target = event.target;

  if (target.id === 'joinCode') {
    state.joinDraft = target.value;
    if (state.joinError) {
      state.joinError = '';
      const errorEl = document.getElementById('joinError');
      if (errorEl) errorEl.remove();
    }
    return;
  }

  if (target.id === 'wordInput') {
    state.wordDraft = target.value;
    state.draftRound = Number(target.dataset.round) || 0;
    syncComposerState();
  }
});

successDialog.addEventListener('close', function () {
  if (state.room && state.room.status === 'success') {
    const key = successKey(state.room);
    if (key) state.dismissedSuccessKey = key;
  }
});

successDialog.addEventListener('click', function (event) {
  if (event.target === successDialog) {
    closeSuccessDialog(true);
  }
});

confirmDialog.addEventListener('click', function (event) {
  if (event.target === confirmDialog) {
    confirmDialog.close();
    return;
  }

  if (event.target.closest('[data-confirm-cancel]')) {
    confirmDialog.close();
    return;
  }

  if (event.target.closest('[data-confirm-ok]')) {
    const action = pendingConfirm;
    pendingConfirm = null;
    confirmDialog.close();
    if (action) action();
  }
});

confirmDialog.addEventListener('close', function () {
  pendingConfirm = null;
});

window.addEventListener('online', function () {
  if (!isSocketOpen()) {
    state.reconnectAttempt = 0;
    window.clearTimeout(state.reconnectTimer);
    state.reconnectTimer = 0;
    connectSocket(true);
  }
});

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && !isSocketOpen() && !state.noReconnect) {
    state.reconnectAttempt = 0;
    window.clearTimeout(state.reconnectTimer);
    state.reconnectTimer = 0;
    connectSocket(true);
  }
});

/* ============================================================
   14. 启动
   ============================================================ */
function boot() {
  const queryCode = readQueryRoom();

  if (window.location.protocol !== 'http:' && window.location.protocol !== 'https:') {
    state.mode = 'server-required';
    state.connection = 'offline';
    render();
    return;
  }

  const stored = loadStoredCredentials();
  if (stored) {
    if (!queryCode || stored.code.toLowerCase() === queryCode.toLowerCase()) {
      state.credentials = stored;
      state.mode = 'restoring';
      state.joinDraft = '';
      state.joinHint = '';
    } else {
      clearStoredCredentials();
      state.credentials = null;
      state.mode = 'join';
      state.joinDraft = queryCode;
      state.joinHint = '有人把一间小屋的钥匙递给了你。';
    }
  } else if (queryCode) {
    state.mode = 'join';
    state.joinDraft = queryCode;
    state.joinHint = '有人把一间小屋的钥匙递给了你。';
  } else {
    state.mode = 'home';
  }

  state.connection = 'connecting';
  render();
  connectSocket();
}

boot();

</script>
