<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f4ee">
<meta name="color-scheme" content="light">
<meta name="description" content="Same Word 双人同词相遇联网版：两个人异地实时联机，各自写下心里的词，看看默契会不会带你们相遇。">
<title>Same Word · 双人同词相遇（联网版）</title>
<style>
/* ============================================================
   0. 基础变量 & 重置
   ============================================================ */
:root {
  --bg: #f8f4ee;
  --bg-deep: #f3ece4;
  --card: rgba(255, 253, 250, 0.84);
  --card-solid: #fffdfa;
  --ink: #3c3733;
  --ink-soft: #675f58;
  --muted: #8d847c;
  --faint: #b5aca3;
  --line: rgba(84, 69, 56, 0.11);
  --line-strong: rgba(84, 69, 56, 0.18);
  --accent: #d98a76;
  --accent-deep: #c67460;
  --accent-soft: #f7e2dc;
  --sage: #789d8c;
  --sage-deep: #5f8575;
  --sage-soft: #e9f1ec;
  --butter: #f7eed7;
  --butter-deep: #a98b4e;
  --lilac: #ece7f2;
  --shadow-sm: 0 6px 20px rgba(91, 70, 52, 0.07);
  --shadow-md: 0 18px 50px rgba(91, 70, 52, 0.10);
  --shadow-lg: 0 30px 90px rgba(91, 70, 52, 0.14);
  --radius-xl: 30px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC",
    sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.65;
  background:
    radial-gradient(1000px 740px at 8% -12%, #ffe7dd 0%, transparent 58%),
    radial-gradient(900px 700px at 102% 16%, #e4f0e7 0%, transparent 55%),
    radial-gradient(900px 760px at 48% 112%, #fff1d5 0%, transparent 58%),
    var(--bg);
  background-attachment: fixed;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body::before,
body::after {
  content: "";
  position: fixed;
  z-index: 0;
  width: 360px;
  height: 360px;
  border-radius: 50%;
  filter: blur(70px);
  pointer-events: none;
  opacity: 0.32;
}

body::before {
  top: -140px;
  right: 8%;
  background: #f6d2c5;
}

body::after {
  bottom: -180px;
  left: -60px;
  background: #d6e7db;
}

button,
input {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
}

button,
a,
input,
summary {
  -webkit-tap-highlight-color: transparent;
}

::selection {
  color: var(--ink);
  background: #f2cfc4;
}

:focus-visible {
  outline: 3px solid rgba(217, 138, 118, 0.42);
  outline-offset: 3px;
}

/* ============================================================
   1. 页面骨架
   ============================================================ */
#app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  min-height: 100svh;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 24px clamp(18px, 4vw, 34px) 8px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
  user-select: none;
}

.brand-mark {
  position: relative;
  display: inline-block;
  flex: 0 0 auto;
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: linear-gradient(145deg, #e5a896 8%, #d77f6a 55%, #c9705d 100%);
  box-shadow: 0 6px 16px rgba(200, 115, 94, 0.26);
}

.brand-mark i {
  position: absolute;
  top: 50%;
  width: 10px;
  height: 10px;
  border: 1.5px solid rgba(255, 255, 255, 0.94);
  border-radius: 50%;
  transform: translateY(-50%);
}

.brand-mark i:first-child {
  left: 8px;
}

.brand-mark i:last-child {
  right: 8px;
}

.brand-word {
  font-size: 16px;
  font-weight: 720;
  letter-spacing: 0.015em;
  line-height: 1.05;
}

.brand-word small {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.16em;
}

.top-meta {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}

.offline-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 11px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 560;
  white-space: nowrap;
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.5);
  box-shadow: 0 3px 10px rgba(84, 69, 56, 0.04);
}

.offline-badge::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--sage);
  box-shadow: 0 0 0 3px rgba(120, 157, 140, 0.14);
}

.code-chip {
  max-width: 160px;
  overflow: hidden;
  padding: 7px 12px;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.12em;
  text-overflow: ellipsis;
  white-space: nowrap;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.58);
  transition: background 0.2s ease, border-color 0.2s ease;
}

.code-chip:hover {
  background: #fff;
  border-color: var(--line-strong);
}

.main {
  flex: 1;
  width: 100%;
  max-width: 920px;
  margin: 0 auto;
  padding: clamp(18px, 4vw, 46px) clamp(18px, 4vw, 34px) 48px;
}

.main--wide {
  max-width: 1060px;
}

.footer {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 8px clamp(18px, 4vw, 34px) 26px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-align: center;
}

.footer span {
  display: inline-block;
  margin: 0 5px;
  color: #c99a8d;
}

/* ============================================================
   2. 通用组件
   ============================================================ */
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  color: var(--accent-deep);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.eyebrow::before {
  content: "";
  display: inline-block;
  width: 18px;
  height: 1px;
  background: currentColor;
  opacity: 0.55;
}

.card {
  border: 1px solid rgba(255, 255, 255, 0.88);
  border-radius: var(--radius-xl);
  background: var(--card);
  box-shadow: var(--shadow-md);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 12px 21px;
  color: var(--ink-soft);
  font-size: 14px;
  font-weight: 650;
  line-height: 1.25;
  text-align: center;
  white-space: nowrap;
  border: 1px solid transparent;
  border-radius: 999px;
  background: transparent;
  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease,
    background 0.18s ease,
    border-color 0.18s ease,
    opacity 0.18s ease;
}

.btn:not(:disabled):hover {
  transform: translateY(-1px);
}

.btn:not(:disabled):active {
  transform: translateY(0) scale(0.985);
}

.btn:disabled {
  opacity: 0.56;
}

.btn-primary {
  color: #fff;
  background: var(--ink);
  box-shadow: 0 10px 24px rgba(60, 55, 51, 0.17);
}

.btn-primary:not(:disabled):hover {
  box-shadow: 0 14px 30px rgba(60, 55, 51, 0.22);
}

.btn-accent {
  color: #fff;
  background: linear-gradient(135deg, #e5a08e 0%, #d77e68 100%);
  box-shadow: 0 12px 26px rgba(201, 116, 94, 0.24);
}

.btn-accent:not(:disabled):hover {
  box-shadow: 0 16px 34px rgba(201, 116, 94, 0.3);
}

.btn-soft {
  color: var(--ink-soft);
  border-color: var(--line);
  background: rgba(255, 255, 255, 0.7);
  box-shadow: var(--shadow-sm);
}

.btn-soft:not(:disabled):hover {
  background: #fff;
  border-color: var(--line-strong);
}

.btn-ghost {
  color: var(--muted);
  border-color: var(--line);
  background: rgba(255, 255, 255, 0.34);
}

.btn-ghost:not(:disabled):hover {
  color: var(--ink-soft);
  background: rgba(255, 255, 255, 0.65);
}

.btn-sage {
  color: #fff;
  background: linear-gradient(135deg, #8fb4a3 0%, #6f9785 100%);
  box-shadow: 0 12px 26px rgba(95, 133, 117, 0.22);
}

.btn-block {
  width: 100%;
}

.btn-small {
  min-height: 38px;
  padding: 8px 14px;
  font-size: 12.5px;
}

.btn svg {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.text-button {
  padding: 4px;
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 560;
  border: 0;
  background: transparent;
  transition: color 0.2s ease;
}

.text-button:hover {
  color: var(--ink-soft);
}

.text-button.danger:hover {
  color: #b75d52;
}

.divider-dot {
  color: var(--faint);
  font-size: 11px;
}

/* 无障碍隐藏文本 */
.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

/* ============================================================
   3. 首页
   ============================================================ */
.home-main {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: calc(100svh - 160px);
  padding-top: clamp(20px, 4vh, 54px);
}

.hero {
  position: relative;
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  text-align: center;
}

.hero-kicker {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 18px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.24em;
  text-transform: uppercase;
}

.hero-kicker::before,
.hero-kicker::after {
  content: "";
  width: 18px;
  height: 1px;
  background: var(--faint);
  opacity: 0.55;
}

.hero h1 {
  margin: 0;
  font-size: clamp(42px, 8.2vw, 74px);
  font-weight: 720;
  letter-spacing: -0.052em;
  line-height: 1.13;
}

.hero h1 em {
  position: relative;
  display: inline-block;
  color: var(--accent-deep);
  font-style: normal;
}

.hero h1 em::after {
  content: "";
  position: absolute;
  right: 2%;
  bottom: 4px;
  left: 2%;
  z-index: -1;
  height: 12px;
  border-radius: 999px;
  background: #f4d9d0;
  opacity: 0.72;
  transform: rotate(-1.2deg);
}

.hero-sub {
  max-width: 530px;
  margin: 22px auto 0;
  color: var(--ink-soft);
  font-size: clamp(14.5px, 1.8vw, 17px);
  line-height: 1.9;
}

.float-word {
  position: absolute;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 58px;
  height: 36px;
  padding: 0 15px;
  color: var(--ink-soft);
  font-size: 12px;
  font-weight: 560;
  letter-spacing: 0.08em;
  border: 1px solid rgba(255, 255, 255, 0.86);
  border-radius: 999px;
  background: rgba(255, 253, 249, 0.6);
  box-shadow: 0 10px 24px rgba(91, 70, 52, 0.06);
  backdrop-filter: blur(10px);
  animation: floaty 7s ease-in-out infinite;
  pointer-events: none;
}

.float-word--one {
  top: 2%;
  left: -15%;
  transform: rotate(-5deg);
  animation-delay: -1.4s;
}

.float-word--two {
  top: 22%;
  right: -15%;
  transform: rotate(4deg);
  animation-delay: -3.2s;
}

.float-word--three {
  bottom: 6%;
  left: -11%;
  transform: rotate(-3deg);
  animation-delay: -5s;
}

.choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  width: 100%;
  max-width: 760px;
  margin: clamp(36px, 6vh, 58px) auto 0;
}

.choice-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 15px;
  min-height: 112px;
  padding: 21px 22px;
  overflow: hidden;
  text-align: left;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: var(--radius-lg);
  background: rgba(255, 253, 250, 0.76);
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(16px);
  transition:
    transform 0.22s ease,
    box-shadow 0.22s ease,
    border-color 0.22s ease,
    background 0.22s ease;
}

.choice-card::after {
  content: "";
  position: absolute;
  top: -50px;
  right: -40px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: #f7e2dc;
  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
}

.choice-card:nth-child(2)::after {
  background: #e7f0e9;
}

.choice-card:hover {
  z-index: 1;
  transform: translateY(-4px);
  border-color: rgba(255, 255, 255, 1);
  background: rgba(255, 253, 250, 0.94);
  box-shadow: 0 22px 46px rgba(91, 70, 52, 0.12);
}

.choice-card:hover::after {
  opacity: 0.9;
}

.choice-card > * {
  position: relative;
  z-index: 1;
}

.choice-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 51px;
  height: 51px;
  color: var(--accent-deep);
  border-radius: 17px;
  background: var(--accent-soft);
}

.choice-card--join .choice-icon {
  color: var(--sage-deep);
  background: var(--sage-soft);
}

.choice-icon svg {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.65;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.choice-copy {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.choice-copy strong {
  font-size: 18px;
  font-weight: 690;
  letter-spacing: -0.01em;
}

.choice-copy span {
  margin-top: 5px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.choice-arrow {
  margin-left: auto;
  color: var(--faint);
  font-size: 19px;
  transition: transform 0.22s ease, color 0.22s ease;
}

.choice-card:hover .choice-arrow {
  color: var(--accent-deep);
  transform: translateX(3px);
}

.home-tags {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 25px auto 0;
  color: var(--faint);
  font-size: 10.5px;
  letter-spacing: 0.06em;
}

.home-tags i {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: currentColor;
}

.rules {
  width: 100%;
  max-width: 760px;
  margin: 28px auto 0;
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 20px;
  background: rgba(255, 253, 250, 0.52);
  box-shadow: 0 8px 24px rgba(91, 70, 52, 0.045);
}

.rules summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 20px;
  list-style: none;
  cursor: pointer;
  user-select: none;
}

.rules summary::-webkit-details-marker {
  display: none;
}

.rules-title {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--ink-soft);
  font-size: 12.5px;
  font-weight: 620;
}

.rules-title::before {
  content: "?";
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 21px;
  height: 21px;
  color: var(--accent-deep);
  font-family: Georgia, serif;
  font-size: 12px;
  border-radius: 50%;
  background: var(--accent-soft);
}

.rules-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--faint);
  font-size: 10.5px;
}

.rules-toggle i {
  display: inline-block;
  font-size: 15px;
  font-style: normal;
  line-height: 1;
  transition: transform 0.24s ease;
}

.rules[open] .rules-toggle i {
  transform: rotate(45deg);
}

.rules-body {
  padding: 0 20px 20px;
}

.rules-list {
  display: grid;
  gap: 11px;
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: rule;
}

.rules-list li {
  display: grid;
  grid-template-columns: 24px 1fr;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.72;
  counter-increment: rule;
}

.rules-list li::before {
  content: counter(rule, decimal-leading-zero);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  line-height: 2.1;
}

.rules-list b {
  display: block;
  color: var(--ink-soft);
  font-size: 12.5px;
  font-weight: 630;
}

.rules-note {
  margin: 14px 0 0;
  padding-top: 13px;
  color: var(--faint);
  font-size: 10.5px;
  line-height: 1.7;
  border-top: 1px dashed var(--line);
}

/* ============================================================
   4. 加入房间
   ============================================================ */
.join-main {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: calc(100svh - 160px);
  max-width: 620px;
}

.back-button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  align-self: flex-start;
  margin-bottom: 20px;
  padding: 7px 2px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 560;
  border: 0;
  background: transparent;
}

.back-button:hover {
  color: var(--ink-soft);
}

.join-card {
  padding: clamp(27px, 6vw, 46px);
  text-align: left;
}

.join-card h1 {
  margin: 10px 0 0;
  font-size: clamp(32px, 5.7vw, 46px);
  font-weight: 710;
  letter-spacing: -0.045em;
  line-height: 1.18;
}

.join-lead {
  max-width: 400px;
  margin: 14px 0 0;
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.8;
}

.soft-hint {
  display: flex;
  gap: 9px;
  margin: 20px 0 0;
  padding: 11px 14px;
  color: var(--sage-deep);
  font-size: 11.5px;
  line-height: 1.65;
  border: 1px solid rgba(120, 157, 140, 0.18);
  border-radius: 13px;
  background: rgba(233, 241, 236, 0.65);

.soft-hint::before {
  content: "✦";

}

.join-form {

}

.field-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  color: var(--ink-soft);
  font-size: 11.5px;
  font-weight: 620;
}

.field-label small {
  color: var(--faint);
  font-size: 10px;
  font-weight: 500;
}

.join-row {
  display: flex;
  gap: 9px;
}

.code-input {
  flex: 1;
  min-width: 0;
  height: 56px;
  padding: 0 16px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 650;
  letter-spacing: 0.22em;
  text-align: center;
  text-transform: none;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-md);
  outline: none;
  background: rgba(255, 255, 255, 0.86);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.code-input::placeholder {
  color: #c8c0b8;
  font-size: 15px;

}

.code-input:focus {

.local-tip {

}

.page-head h1 {

}

.page-head p {

.waiting-grid {

.code-card {

.code-label {

.room-code {

}

.share-box span {

}

.share-box .btn {

}

.seat-card {

}

.seat-card h2 {

}

.seat-card > p {
  margin: 7px 0 0;

  line-height: 1.7;
}

.seat-list {

.seat {

}

}

  font-size: 11px;
  font-weight: 650;

}

}

.seat-avatar::after {
  content: "";

  inset: -4px;
  border: 1px solid rgba(217, 138, 118, 0.24);

}

.seat--empty .seat-avatar::after {
  border-color: rgba(141, 132, 124, 0.18);
}

.seat-info {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
}

.seat-info strong {
  color: var(--ink-soft);

  font-weight: 620;
}

.seat-info span {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10.5px;
}

.seat-pill {
  padding: 4px 8px;
  color: var(--sage-deep);
  font-size: 9px;
  font-weight: 650;
  letter-spacing: 0.04em;

}

.seat--empty .seat-pill {

}

.seat-foot {
  margin-top: auto;
}

.sync-note {
  margin: 9px 0 0;
  color: var(--muted);

  text-align: center;
}

.waiting-actions {
  display: flex;
  justify-content: center;
  margin-top: 22px;
}

.local-note {
  display: flex;
  gap: 11px;
  max-width: 720px;
  margin: 20px auto 0;
  padding: 13px 17px;

  font-size: 10.5px;

  border-radius: 14px;

}

  line-height: 1.2;
}

.local-note strong {
  color: var(--muted);

}

.waiting-dots {

}

}

.waiting-dots i:nth-child(2) {
  animation-delay: 0.15s;
}

.waiting-dots i:nth-child(3) {
  animation-delay: 0.3s;
}

/* ============================================================
   6. 对局
   ============================================================ */
.game-main {
  max-width: 1060px;
}

.game-title-wrap {

}

.game-head h1 {

.game-sub {

.phase-desc {

.seed-strip {

}

.seed-note {

.word-form {

.word-label-row {

.word-input {

.word-input::placeholder {

}

.word-row .btn {
  flex: 0 0 auto;
  min-width: 126px;
  height: 57px;
}

.form-hint {
  display: flex;
  align-items: center;

}

.form-hint::before {
  content: "○";
  color: var(--sage);

}

.sealed-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 22px;
  padding: 28px 20px;
  text-align: center;
  border: 1px dashed rgba(217, 138, 118, 0.28);
  border-radius: 18px;
  background:
    radial-gradient(220px 150px at 50% 0%, rgba(247, 226, 220, 0.55), transparent 72%),
    rgba(255, 255, 255, 0.33);
}

.sealed-icon {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;

  font-size: 17px;
  border-radius: 50%;

.sealed-icon::before {

}

.sealed-icon::after {

.sealed-state h2 {

  font-size: 17px;

.sealed-state p {

.inline-refresh {

  padding: 5px 10px;

.privacy-line {

.privacy-line::before {
  content: "◌";
  color: var(--sage);
  font-size: 10px;
}

  font-size: 10.5px;
}

.room-strip-left,
.room-strip-right {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
}

.code-inline {
  padding: 3px 7px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.09em;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.4);
}

.code-inline:hover {
  background: #fff;
}

/* ============================================================
   7. 联想链 / 历史
   ============================================================ */
.history-card {
  position: sticky;
  top: 20px;
  align-self: start;
  max-height: calc(100svh - 40px);
  padding: 21px;
  overflow: auto;
}

.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

.panel-kicker {
  margin: 0;
  color: var(--faint);
  font-size: 8.5px;
  font-weight: 650;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.panel-head h2 {
  margin: 4px 0 0;
  font-size: 17px;
  font-weight: 680;
  letter-spacing: -0.025em;
}

.round-count {
  flex: 0 0 auto;
  margin-top: 3px;
  padding: 4px 9px;
  color: var(--accent-deep);
  font-size: 9px;
  font-weight: 650;
  border-radius: 999px;
  background: var(--accent-soft);
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin: 16px 0 0;
  padding: 0;
  list-style: none;
}

.history-item {
  position: relative;
  padding: 0 0 16px 16px;
  border-left: 1px solid rgba(84, 69, 56, 0.11);
}

.history-item:last-child {
  padding-bottom: 0;
  border-left-color: transparent;
}

.history-item::before {
  content: "";
  position: absolute;
  top: 3px;
  left: -3.5px;
  width: 6px;
  height: 6px;
  border: 1px solid #fff;
  border-radius: 50%;
  background: #d8c7bb;
  box-shadow: 0 0 0 2px rgba(216, 199, 187, 0.12);
}

.history-item.is-exact::before,
.history-item.is-synonym::before {
  background: var(--accent);
  box-shadow: 0 0 0 2px rgba(217, 138, 118, 0.12);
}

.history-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.history-round {
  color: var(--muted);
  font-size: 9px;
  font-weight: 650;
  letter-spacing: 0.08em;
}

.result-tag {
  padding: 2px 6px;
  color: var(--muted);
  font-size: 8px;
  font-weight: 620;
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.55);
}

.result-tag.is-exact,
.result-tag.is-synonym {
  color: var(--accent-deep);
  background: var(--accent-soft);
}

.result-tag.is-continue {
  color: var(--muted);
  background: rgba(233, 228, 222, 0.65);
}

.history-pair {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
}

.history-word {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  max-width: 100%;
  padding: 3px 7px;
  color: var(--ink-soft);
  font-size: 10.5px;
  font-weight: 560;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.6);
  overflow-wrap: anywhere;
}

.history-word i {
  color: var(--faint);
  font-size: 7.5px;
  font-style: normal;
}

.history-x {
  color: var(--faint);
  font-size: 8px;
}

.history-note {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.55;
}

.history-votes {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.5;
}

.history-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 16px;
  padding: 24px 12px;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: 14px;
}

.history-empty-art {
  position: relative;
  width: 60px;
  height: 30px;
  margin-bottom: 10px;
}

.history-empty-art::before,
.history-empty-art::after {
  content: "";
  position: absolute;
  top: 12px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #e3cfc5;
}

.history-empty-art::before {
  left: 9px;
}

.history-empty-art::after {
  right: 9px;
}

.history-empty-art span {
  position: absolute;
  top: 15px;
  right: 18px;
  left: 18px;
  height: 1px;
  background: repeating-linear-gradient(90deg, #d9cbc1 0 3px, transparent 3px 6px);
}

.history-empty p {
  margin: 0;
  color: var(--faint);
  font-size: 9.5px;
  line-height: 1.65;
}

.panel-foot {
  margin: 16px 0 0;
  padding-top: 11px;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.6;
  border-top: 1px dashed var(--line);
}

/* ============================================================
   8. 成功页面
   ============================================================ */
.success-main {
  max-width: 940px;
}

.success-hero {
  position: relative;
  padding: clamp(34px, 6vw, 62px) clamp(22px, 5vw, 48px) clamp(27px, 4vw, 40px);
  overflow: hidden;
  text-align: center;
  background:
    radial-gradient(420px 300px at 50% -15%, rgba(247, 214, 203, 0.75), transparent 72%),
    radial-gradient(320px 220px at 90% 100%, rgba(230, 241, 234, 0.55), transparent 70%),
    rgba(255, 253, 250, 0.82);
}

.success-hero::before,
.success-hero::after {
  content: "♡";
  position: absolute;
  color: rgba(217, 138, 118, 0.16);
  font-family: Georgia, serif;
  pointer-events: none;
  animation: heartFloat 7s ease-in-out infinite;
}

.success-hero::before {
  top: 16%;
  left: 8%;
  font-size: 28px;
}

.success-hero::after {
  top: 30%;
  right: 9%;
  bottom: auto;
  font-size: 20px;
  animation-delay: -2.8s;
}

.success-orbit {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 104px;
  height: 104px;
  margin: 0 auto 16px;
}

.success-orbit .orbit-ring {
  position: absolute;
  border: 1px solid rgba(217, 138, 118, 0.16);
  border-radius: 50%;
}

.success-orbit .orbit-ring:nth-child(1) {
  inset: 0;
}

.success-orbit .orbit-ring:nth-child(2) {
  inset: 10px;
  border-style: dashed;
  animation: spinSlow 18s linear infinite;
}

.success-orbit .orbit-heart {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 57px;
  height: 57px;
  color: #fff;
  font-size: 25px;
  border-radius: 50%;
  background: linear-gradient(145deg, #e7a391, #ce735e);
  box-shadow: 0 14px 30px rgba(201, 116, 94, 0.25);
  animation: heartbeat 2.4s ease-in-out infinite;
}

.success-hero h1 {
  margin: 8px 0 0;
  font-size: clamp(38px, 7vw, 62px);
  font-weight: 720;
  letter-spacing: -0.052em;
  line-height: 1.24;
}

.success-copy {
  max-width: 530px;
  margin: 13px auto 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.9;
}

.final-pair {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 45px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  width: 100%;
  max-width: 560px;
  margin: 26px auto 0;
}

.final-word {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 106px;
  padding: 15px 12px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.92);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.67);
  box-shadow: 0 12px 26px rgba(91, 70, 52, 0.06);
}

.final-word span {
  color: var(--faint);
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: 0.14em;
}

.final-word strong {
  max-width: 100%;
  margin-top: 7px;
  font-size: clamp(21px, 3.2vw, 29px);
  font-weight: 680;
  line-height: 1.35;
  letter-spacing: -0.025em;
  overflow-wrap: anywhere;
}

.final-heart {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 43px;
  height: 43px;
  color: var(--accent-deep);
  font-size: 18px;
  border: 1px solid rgba(217, 138, 118, 0.16);
  border-radius: 50%;
  background: var(--accent-soft);
}

.success-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 9px;
  margin-top: 24px;
}

.success-actions .btn {
  min-width: 132px;
}

.rematch-hint {
  min-height: 18px;
  max-width: 460px;
  margin: 11px auto 0;
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.65;
}

.full-history {
  position: static;
  max-height: none;
  margin-top: 17px;
  padding: clamp(21px, 3.4vw, 31px);
  overflow: visible;
}

.full-history .history-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 18px;
}

.full-history .history-item {
  padding: 14px 14px 14px 18px;
  border: 1px solid var(--line);
  border-left-width: 1px;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.42);
}

.full-history .history-item:last-child {
  padding-bottom: 14px;
}

.full-history .history-item::before {
  top: 18px;
  left: -3.5px;
}

.full-history .history-item.is-exact,
.full-history .history-item.is-synonym {
  border-color: rgba(217, 138, 118, 0.2);
  background: rgba(247, 226, 220, 0.32);
}

.full-history .history-head {
  margin-bottom: 8px;
}

.full-history .history-word {
  font-size: 11px;
}

.full-history .history-note {
  font-size: 9px;
}

.full-history .history-votes {
  font-size: 8.5px;
}

/* ============================================================
   9. 弹窗 / 提示
   ============================================================ */
.dialog {
  width: min(92vw, 550px);
  max-width: 550px;
  padding: 0;
  color: var(--ink);
  border: 0;
  background: transparent;
  overflow: visible;
}

.dialog::backdrop {
  background: rgba(56, 46, 39, 0.36);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
}

.dialog-card {
  position: relative;
  width: 100%;
  max-height: calc(100svh - 36px);
  padding: clamp(27px, 5vw, 38px);
  overflow: auto;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 29px;
  background: #fffdfa;
  box-shadow: 0 35px 100px rgba(56, 46, 39, 0.26);
}

.dialog[open] .dialog-card {
  animation: dialogIn 0.3s cubic-bezier(0.2, 0.85, 0.25, 1) both;
}

.dialog-close {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  color: var(--faint);
  font-size: 19px;
  line-height: 1;
  border: 1px solid transparent;
  border-radius: 50%;
  background: transparent;
  transition: background 0.2s ease, color 0.2s ease;
}

.dialog-close:hover {
  color: var(--ink-soft);
  background: rgba(84, 69, 56, 0.06);
}

.dialog-kicker {
  margin: 0;
  color: var(--accent-deep);
  font-size: 9px;
  font-weight: 680;
  letter-spacing: 0.2em;
  text-align: center;
  text-transform: uppercase;
}

.dialog-title {
  margin: 9px 0 0;
  font-size: clamp(31px, 6vw, 42px);
  font-weight: 720;
  letter-spacing: -0.05em;
  line-height: 1.25;
  text-align: center;
}

.dialog-sub {
  margin: 9px auto 0;
  max-width: 370px;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.8;
  text-align: center;
}

.celebrate-pair {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 38px minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  margin: 23px 0 0;
}

.celebrate-word {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
  padding: 14px 9px;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #fff;
}

.celebrate-word span {
  color: var(--faint);
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.1em;
}

.celebrate-word strong {
  max-width: 100%;
  margin-top: 5px;
  font-size: clamp(18px, 3.5vw, 24px);
  font-weight: 680;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.celebrate-heart {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 37px;
  height: 37px;
  color: var(--accent-deep);
  font-size: 16px;
  border-radius: 50%;
  background: var(--accent-soft);
}

.dialog-copy {
  margin: 14px auto 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
  text-align: center;
}

.dialog-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 21px;
}

.dialog-actions .btn {
  min-width: 125px;
}

.rematch-note {
  min-height: 17px;
  margin: 12px auto 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.65;
  text-align: center;
}

.confetti-field {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  border-radius: inherit;
  pointer-events: none;
}

.confetti-field i {
  position: absolute;
  top: -20px;
  left: var(--left);
  display: block;
  width: 7px;
  height: 10px;
  border-radius: 2px;
  background: var(--color);
  opacity: 0;
  animation: confettiFall var(--duration) ease-in var(--delay) forwards;
}

.dialog-card > :not(.confetti-field):not(.dialog-close) {
  position: relative;
  z-index: 1;
}

.confirm-dialog {
  width: min(92vw, 420px);
  max-width: 420px;
}

.confirm-card {
  padding: 31px;
  text-align: left;
}

.confirm-card .dialog-kicker {
  color: var(--faint);
  text-align: left;
}

.confirm-card h2 {
  margin: 8px 0 0;
  font-size: 25px;
  font-weight: 710;
  letter-spacing: -0.04em;
  line-height: 1.35;
}

.confirm-card p {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.8;
}

.confirm-card .dialog-actions {
  justify-content: flex-end;
  margin-top: 23px;
}

.confirm-card .dialog-actions .btn {
  min-width: 0;
  padding-right: 18px;
  padding-left: 18px;
}

.btn-danger {
  color: #fff;
  background: #b96658;
  box-shadow: 0 8px 20px rgba(185, 102, 88, 0.2);
}

.toast {
  position: fixed;
  bottom: max(24px, env(safe-area-inset-bottom));
  left: 50%;
  z-index: 200;
  max-width: min(88vw, 420px);
  padding: 11px 18px;
  color: #fffdfa;
  font-size: 11.5px;
  font-weight: 520;
  line-height: 1.5;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  background: rgba(53, 47, 43, 0.9);
  box-shadow: 0 12px 34px rgba(53, 47, 43, 0.2);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 14px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ============================================================
   10. 空状态 / 提示页
   ============================================================ */
.empty-main {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: calc(100svh - 160px);
  max-width: 580px;
}

.empty-card {
  padding: clamp(30px, 6vw, 48px);
  text-align: center;
}

.empty-art {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 72px;
  height: 72px;
  color: var(--accent-deep);
  font-size: 26px;
  border-radius: 50%;
  background: var(--accent-soft);
  box-shadow: 0 12px 28px rgba(201, 116, 94, 0.12);
}

.empty-card h1 {
  margin: 19px 0 0;
  font-size: clamp(28px, 5vw, 38px);
  font-weight: 710;
  letter-spacing: -0.04em;
  line-height: 1.3;
}

.empty-card p {
  max-width: 390px;
  margin: 12px auto 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.85;
}

.empty-card .btn {
  margin-top: 22px;
}

.noscript {
  position: fixed;
  right: 20px;
  bottom: 20px;
  left: 20px;
  z-index: 300;
  padding: 14px;
  color: #8f4e44;
  font-size: 13px;
  text-align: center;
  border-radius: 14px;
  background: #fff3ef;
}

/* ============================================================
   11. 动画
   ============================================================ */
@keyframes floaty {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -8px; }
}

@keyframes seatPulse {
  0% { transform: scale(0.92); opacity: 0.7; }
  70%, 100% { transform: scale(1.18); opacity: 0; }
}

@keyframes dotBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
  30% { transform: translateY(-3px); opacity: 1; }
}

@keyframes sealRing {
  0% { transform: scale(0.92); opacity: 0.55; }
  70%, 100% { transform: scale(1.25); opacity: 0; }
}

@keyframes wordIn {
  from { opacity: 0; transform: translateY(13px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  12% { transform: scale(1.1); }
  24% { transform: scale(1); }
  36% { transform: scale(1.06); }
  48% { transform: scale(1); }
}

@keyframes heartFloat {
  0%, 100% { transform: translateY(0) rotate(-4deg); opacity: 0.6; }
  50% { transform: translateY(-10px) rotate(4deg); opacity: 1; }
}

@keyframes spinSlow {
  to { transform: rotate(360deg); }
}

@keyframes dialogIn {
  from { opacity: 0; transform: translateY(14px) scale(0.975); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes confettiFall {
  0% {
    opacity: 1;
    transform: translate3d(0, -10px, 0) rotate(0deg);
  }
  85% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translate3d(var(--drift), 520px, 0) rotate(var(--rot));
  }
}

/* ============================================================
   12. 响应式
   ============================================================ */
.nowrap {
  white-space: nowrap;
}

@media (max-width: 1180px) {
  .float-word {
    display: none;
  }
}

@media (max-width: 840px) {
  .game-grid {
    grid-template-columns: 1fr;
  }

  .history-card {
    position: static;
    max-height: none;
  }

  .waiting-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .game-head {
    align-items: flex-start;
    flex-direction: column;
    gap: 14px;
  }

  .sync-cluster {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  .full-history .history-list {
    grid-template-columns: 1fr;
  }
}

.mobile-only-break {
  display: none;
}

@media (max-width: 620px) {
  .mobile-only-break {
    display: inline;
  }

  .topbar {
    padding-top: 18px;
  }

  .brand-word {
    font-size: 14.5px;
  }

  .brand-word small {
    font-size: 8.5px;
  }

  .offline-badge {
    padding: 6px 8px;
    font-size: 9.5px;
  }

  .code-chip {
    max-width: 116px;
    padding: 6px 8px;
    font-size: 9.5px;
  }

  .main {
    padding-top: 18px;
    padding-bottom: 34px;
  }

  .home-main,
  .join-main {
    min-height: calc(100svh - 140px);
  }

  .hero h1 {
    font-size: clamp(38px, 11.5vw, 56px);
  }

  .hero-sub {
    margin-top: 18px;
    font-size: 13.5px;
  }

  .choice-grid {
    grid-template-columns: 1fr;
    margin-top: 32px;
  }

  .choice-card {
    min-height: 92px;
    padding: 17px 18px;
  }

  .choice-icon {
    width: 45px;
    height: 45px;
    border-radius: 14px;
  }

  .choice-copy strong {
    font-size: 16px;
  }

  .rules summary {
    padding: 14px 16px;
  }

  .rules-body {
    padding: 0 16px 17px;
  }

  .join-row {
    flex-direction: column;
  }

  .join-row .btn {
    width: 100%;
    min-width: 0;

<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- 成功庆祝弹窗 -->

    <div id="successDialogBody"></div>
  </div>
</dialog>

<!-- 退出确认弹窗 -->
<dialog id="confirmDialog" class="dialog confirm-dialog" aria-labelledby="confirmTitle" aria-describedby="confirmText">
  <div class="dialog-card confirm-card">
    <p class="dialog-kicker">just checking</p>
    <h2 id="confirmTitle">确认一下</h2>
    <p id="confirmText"></p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-ghost" data-confirm-cancel>再等等</button>
      <button type="button" class="btn btn-danger" id="confirmOk" data-confirm-ok>确认</button>
    </div>
  </div>
</dialog>

<noscript>
  <div class="noscript">这个游戏需要开启 JavaScript 才能运行哦。</div>
</noscript>

<script>
'use strict';

/* ============================================================
   1. 常量、DOM 与运行时状态
   ============================================================ */
const MAX_WORD_LENGTH = 24;
const SESSION_KEY = 'sameword:online:credentials';
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
const successDialog = document.getElementById('successDialog');
const successDialogBody = document.getElementById('successDialogBody');
const confettiField = document.getElementById('confettiField');
const confirmDialog = document.getElementById('confirmDialog');
const confirmTitle = document.getElementById('confirmTitle');
const confirmText = document.getElementById('confirmText');
const confirmOk = document.getElementById('confirmOk');

const state = {
  connection: 'connecting', // connecting | online | offline
  socket: null,
  mode: 'home',            // home | join | room | missing | restoring | server-required
  room: null,
  joinDraft: '',
  joinError: '',
  joinHint: '',
  wordDraft: '',
  draftRound: 0,
  dismissedSuccessKey: '',
  reconnectAttempt: 0,
  reconnectTimer: 0,
  pendingAction: null,
  credentials: null,
  busy: false,
  busyTimer: 0,
  lastAction: '',
  lastSyncedAt: 0,
  missingTitle: '',
  missingMessage: '',
  focusAfterRender: '',
  screenKey: '',
  noReconnect: false,
  hadDisconnect: false,
  lastServerMessageAt: 0
};

let toastTimer = 0;
let pendingConfirm = null;

/* ============================================================
   2. 通用小工具
   ============================================================ */
function esc(value) {
  return String(value).replace(/[&<>"']/g, function (char) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[char];
  });
}

function charLength(value) {
  return Array.from(String(value || '')).length;
}

function cleanWord(value) {
  return String(value || '')
    .normalize('NFC')
    .replace(/[\u0000-\u001F\u007F]/g, '')
    .trim()
    .replace(/\s+/g, ' ');
}

function normalizeCodeInput(value) {
  return String(value || '').trim();
}

function isValidCode(value) {
  return /^[A-Za-z0-9]{6}$/.test(String(value || ''));
}

function nowClock(timestamp) {
  const date = new Date(Number(timestamp) || Date.now());
  try {
    return date.toLocaleTimeString('zh-CN', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });
  } catch (error) {
    return (
      String(date.getHours()).padStart(2, '0') +
      ':' +
      String(date.getMinutes()).padStart(2, '0')
    );
  }
}

function showToast(message) {
  if (!message) return;
  window.clearTimeout(toastTimer);
  toastEl.textContent = message;
  toastEl.classList.add('is-visible');
  toastTimer = window.setTimeout(function () {
    toastEl.classList.remove('is-visible');
  }, 3000);
}

function setFocusAfterRender(id) {
  state.focusAfterRender = id;
}

function focusAfterRender() {
  if (!state.focusAfterRender) return;
  const id = state.focusAfterRender;
  state.focusAfterRender = '';
  window.requestAnimationFrame(function () {
    const element = document.getElementById(id);
    if (!element) return;
    element.focus({ preventScroll: false });
    if (element.tagName === 'INPUT' && typeof element.select === 'function') {
      element.select();
    }
  });
}

function isSocketOpen() {
  return Boolean(state.socket && state.socket.readyState === WebSocket.OPEN);
}

function connectionLabel() {
  if (state.mode === 'server-required') return '未连接';
  if (state.connection === 'online') return '实时联机';
  if (state.connection === 'connecting') return '连接中';
  return '连接断开 · 重连';
}

/* ============================================================
   3. 本地会话凭证
   ============================================================ */
function loadStoredCredentials() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (
      !data ||
      !isValidCode(data.code) ||
      typeof data.playerId !== 'string' ||
      !data.playerId ||
      typeof data.token !== 'string' ||
      !data.token
    ) {
      return null;
    }
    return data;
  } catch (error) {
    return null;
  }
}

function saveStoredCredentials(credentials) {
  try {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(credentials));
  } catch (error) {
    /* 只影响刷新后的自动回到房间 */
  }
}

function clearStoredCredentials() {
  try {
    sessionStorage.removeItem(SESSION_KEY);
  } catch (error) {
    /* 忽略 */
  }
}

function readQueryRoom() {
  try {
    return normalizeCodeInput(new URLSearchParams(window.location.search).get('room') || '');
  } catch (error) {
    return '';
  }
}

function setRoomInUrl(code) {
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('room', code);
    window.history.replaceState({}, '', url.toString());
  } catch (error) {
    /* 忽略 */
  }
}

function clearRoomInUrl() {
  try {
    const url = new URL(window.location.href);
    url.searchParams.delete('room');
    window.history.replaceState({}, '', url.toString());
  } catch (error) {
    /* 忽略 */
  }
}

function buildShareLink(code) {
  try {
    const url = new URL(window.location.href);
    url.search = '';
    url.hash = '';
    url.searchParams.set('room', code);
    return url.toString();
  } catch (error) {
    return window.location.origin + window.location.pathname + '?room=' + encodeURIComponent(code);
  }
}

function wsUrl() {
  if (window.location.protocol !== 'http:' && window.location.protocol !== 'https:') {
    return '';
  }
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  return protocol + '//' + window.location.host + '/ws';
}

/* ============================================================
   4. WebSocket 连接 / 自动重连
   ============================================================ */
function connectSocket(force) {
  if (state.mode === 'server-required' || state.noReconnect) return;

  if (force && state.socket) {
    const oldSocket = state.socket;
    state.socket = null;
    try {
      oldSocket.close();
    } catch (error) {
      /* 忽略 */
    }
  }

  if (
    state.socket &&
    (state.socket.readyState === WebSocket.CONNECTING ||
      state.socket.readyState === WebSocket.OPEN)
  ) {
    return;
  }

  window.clearTimeout(state.reconnectTimer);
  state.reconnectTimer = 0;

  const url = wsUrl();
  if (!url) {
    state.mode = 'server-required';
    state.connection = 'offline';
    render();
    return;
  }

  if (state.connection !== 'connecting') {
    state.connection = 'connecting';
    render();
  }

  let socket;
  try {
    socket = new WebSocket(url);
  } catch (error) {
    state.connection = 'offline';
    scheduleReconnect();
    render();
    return;
  }

  state.socket = socket;

  socket.addEventListener('open', function () {
    if (state.socket !== socket) return;
    state.connection = 'online';
    state.reconnectAttempt = 0;

    if (state.credentials) {
      sendMessage({
        type: 'resume',
        code: state.credentials.code,
        playerId: state.credentials.playerId,
        token: state.credentials.token
      });
    } else if (state.pendingAction) {
      const action = state.pendingAction;
      state.pendingAction = null;
      dispatchAction(action);
    }

    render();
  });

  socket.addEventListener('message', handleSocketMessage);

  socket.addEventListener('close', function () {
    if (state.socket !== socket) return;
    state.socket = null;
    state.busy = false;
    window.clearTimeout(state.busyTimer);

    if (state.noReconnect) {
      state.connection = 'offline';
      render();
      return;
    }

    state.connection = 'offline';
    state.hadDisconnect = true;
    scheduleReconnect();
    render();
  });

  socket.addEventListener('error', function () {
    /* 浏览器会在 error 后再触发 close，交给 close 处理 */
  });
}

function scheduleReconnect() {
  if (state.noReconnect || state.mode === 'server-required') return;
  if (state.reconnectTimer) return;

  const attempt = state.reconnectAttempt;
  state.reconnectAttempt += 1;
  const delay = Math.min(1000 * Math.pow(1.7, attempt), 10000) + Math.floor(Math.random() * 300);

  state.reconnectTimer = window.setTimeout(function () {
    state.reconnectTimer = 0;
    connectSocket();
  }, delay);
}

function reconnectNow() {
  if (state.noReconnect) {
    showToast('这个页面已经暂停啦，回首页重新开始吧。');
    return;
  }

  if (isSocketOpen()) {
    if (state.room) {
      sendMessage({ type: 'sync' });
      showToast('正在同步最新状态…');
    } else {
      showToast('服务器已经连接上啦。');
    }
    return;
  }

  state.reconnectAttempt = 0;
  window.clearTimeout(state.reconnectTimer);
  state.reconnectTimer = 0;
  connectSocket(true);
  render();
}

function sendMessage(payload) {
  if (!isSocketOpen()) return false;
  try {
    state.socket.send(JSON.stringify(payload));
    return true;
  } catch (error) {
    return false;
  }
}

function armBusyTimeout() {
  window.clearTimeout(state.busyTimer);
  state.busyTimer = window.setTimeout(function () {
    state.busy = false;
  }, 5000);
}

function clearBusy() {
  state.busy = false;
  window.clearTimeout(state.busyTimer);
  state.busyTimer = 0;
}

function dispatchAction(action) {
  if (!action || !isSocketOpen()) {
    state.pendingAction = action || null;
    connectSocket(true);
    return;
  }

  state.busy = true;
  if (!sendMessage(action)) {
    state.busy = false;
    state.pendingAction = action;
    connectSocket(true);
    return;
  }
  armBusyTimeout();
}

/* ============================================================
   5. 服务端消息
   ============================================================ */
function handleSocketMessage(event) {
  let message;
  try {
    message = JSON.parse(event.data);
  } catch (error) {
    return;
  }
  if (!message || typeof message.type !== 'string') return;

  state.lastServerMessageAt = Date.now();

  if (message.type === 'welcome') {
    handleWelcome(message);
  } else if (message.type === 'state') {
    handleState(message);
  } else if (message.type === 'error') {
    handleServerError(message);
  } else if (message.type === 'room-closed') {
    handleRoomClosed(message);
  } else if (message.type === 'replaced') {
    handleReplaced(message);
  } else if (message.type === 'left') {
    clearBusy();
  } else if (message.type === 'server-shutdown') {
    showToast(message.message || '服务器正在重启，稍后恢复连接。');
  }
}

function handleWelcome(message) {
  if (
    !message.room ||
    !isValidCode(message.code) ||
    typeof message.playerId !== 'string' ||
    typeof message.token !== 'string'
  ) {
    showToast('服务器返回的房间信息不太完整，稍后再试。');
    return;
  }

  const isReturning = Boolean(state.credentials);
  state.credentials = {
    code: message.code,
    playerId: message.playerId,
    token: message.token
  };
  saveStoredCredentials(state.credentials);

  state.room = message.room;
  state.mode = 'room';
  state.connection = 'online';
  state.pendingAction = null;
  state.lastAction = '';
  state.lastSyncedAt = Date.now();
  state.reconnectAttempt = 0;
  clearBusy();
  setRoomInUrl(message.code);

  if (message.reason === 'create' || message.reason === 'join') {
    state.wordDraft = '';
    state.draftRound = 0;
    state.dismissedSuccessKey = '';
  }

  render();

  if (message.reason === 'create') {
    showToast('小屋开好啦，把邀请链接递给 TA 吧。');
  } else if (message.reason === 'join') {
    showToast('坐好啦，第一轮开始。');
  } else if (isReturning && state.hadDisconnect) {
    showToast('已重新连回小屋。');
  }
  state.hadDisconnect = false;
}

function handleState(message) {
  if (!message.room || !message.room.code || !isValidCode(message.room.code)) return;

  const previous = state.room;
  const next = message.room;
  const action = state.lastAction;
  state.lastAction = '';

  state.room = next;
  state.mode = 'room';
  state.connection = 'online';
  state.lastSyncedAt = Date.now();
  clearBusy();

  if (next.current && next.current.mySubmitted) {
    state.wordDraft = '';
    state.draftRound = next.current.round;
  }

  const messageForToast = actionToast(action, previous, next) || transitionToast(previous, next, action);
  render();
  if (messageForToast) showToast(messageForToast);
}

function actionToast(action, previous, next) {
  if (action === 'submit') {
    if (next.status === 'success') return '';
    if (next.current && next.current.bothSubmitted) return '两个词见面啦，看看是不是同义。';
    if (next.current && next.current.mySubmitted) return '藏好啦，等 TA 也写下一个词。';
    return '';
  }

  if (action === 'vote') {
    if (next.status === 'success') return '';
    if (
      next.current &&
      previous &&
      previous.current &&
      next.current.round > previous.current.round
    ) {
      return '这一轮先这样，继续往下一轮走。';
    }
    if (next.current && next.current.myVote) {
      return next.current.myVote === 'yes'
        ? '记下「是」啦，等 TA 也选一下。'
        : '这轮先这样，你们继续下一轮。';
    }
    return '';
  }

  if (action === 'rematch') {
    if (next.status === 'playing') return '新一局开始啦，还是那个 TA。';
    if (next.rematch && next.rematch.you) return '已经告诉 TA 啦，等 TA 也点一下。';
    return '';
  }

  return '';
}

function transitionToast(previous, next, action) {
  if (!previous) return '';
  if (action) return '';

  if (previous.status === 'waiting' && next.status === 'playing') {
    return 'TA 进来啦，第一轮开始。';
  }
  if (previous.status === 'success' && next.status === 'playing') {
    return '新一局开始啦，还是那个 TA。';
  }
  if (previous.partnerConnected && !next.partnerConnected) {
    return 'TA 暂时离线了，等 TA 回来就好。';
  }
  if (!previous.partnerConnected && next.partnerConnected && previous.playersCount === 2) {
    return 'TA 回来啦。';
  }
  if (
    previous.status === 'success' &&
    next.rematch &&
    next.rematch.ta &&
    !(previous.rematch && previous.rematch.ta)
  ) {
    return 'TA 已经在等你再来一局啦。';
  }
  if (
    previous.current &&
    next.current &&
    next.current.round > previous.current.round
  ) {
    return '翻到第 ' + next.current.round + ' 轮啦。';
  }
  if (
    previous.current &&
    next.current &&
    !previous.current.bothSubmitted &&
    next.current.bothSubmitted &&
    next.status !== 'success'
  ) {
    return '两个词见面啦。';
  }
  return '';
}

function handleServerError(message) {
  clearBusy();
  state.lastAction = '';
  const action = message.action || '';
  const text = message.message || '刚刚没能完成这个操作，再试一次吧。';

  if (message.code === 'RESUME_FAILED') {
    clearStoredCredentials();
    state.credentials = null;
    state.room = null;
    state.pendingAction = null;
    state.hadDisconnect = false;

    const query = readQueryRoom();
    if (query) {
      state.mode = 'join';
      state.joinDraft = query;
      state.joinError = text;
      setRoomInUrl(query);
    } else {
      state.mode = 'home';
      state.joinDraft = '';
      state.joinError = '';
      clearRoomInUrl();
    }
    render();
    showToast(text);
    return;
  }

  if (message.code === 'NO_ROOM' || message.code === 'ALREADY_IN_ROOM') {
    if (!state.room) {
      clearStoredCredentials();
      state.credentials = null;
    }
  }

  if (message.code === 'NO_ROOM' && state.room) {
    clearStoredCredentials();
    state.credentials = null;
    state.room = null;
    state.mode = 'missing';
    state.missingTitle = '连接已经失效啦。';
    state.missingMessage = '服务器那边找不到你的座位了，回首页重新开一间吧。';
    state.lastAction = '';
    clearBusy();
    clearRoomInUrl();
    render();
    showToast(text);
    return;
  }

  if (action === 'join') {
    state.mode = 'join';
    state.joinError = text;
    setFocusAfterRender('joinCode');
    render();
    showToast(text);
    return;
  }

  if (action === 'create') {
    state.mode = 'home';
    render();
    showToast(text);
    return;
  }

  if (
    isSocketOpen() &&
    state.room &&
    (action === 'submit' || action === 'vote' || action === 'rematch')
  ) {
    sendMessage({ type: 'sync' });
  }

  render();
  showToast(text);
}

function handleRoomClosed(message) {
  if (!state.room && state.mode !== 'restoring') {
    clearStoredCredentials();
    state.credentials = null;
    return;
  }

  clearStoredCredentials();
  state.credentials = null;
  state.room = null;
  state.mode = 'missing';
  state.missingTitle = '小屋关灯啦。';
  state.missingMessage = message.message || '房间已经结束，回首页重新开一间吧。';
  state.lastAction = '';
  state.dismissedSuccessKey = '';
  clearBusy();
  clearRoomInUrl();
  render();
}

function handleReplaced(message) {
  state.noReconnect = true;
  state.connection = 'offline';
  clearStoredCredentials();
  state.credentials = null;
  state.room = null;
  state.mode = 'missing';
  state.missingTitle = '这个座位先暂停啦。';
  state.missingMessage = message.message || '为了避免两个页面互相覆盖，这个页面先停下啦。';
  state.lastAction = '';
  clearBusy();
  clearRoomInUrl();
  render();
}

/* ============================================================
   6. 房间动作
   ============================================================ */
function createRoom() {
  if (state.busy || state.mode === 'restoring' || state.room) return;
  state.joinError = '';
  const action = { type: 'create' };

  if (!isSocketOpen()) {
    state.pendingAction = action;
    showToast('正在连接房间服务器…');
    connectSocket(true);
    render();
    return;
  }

  state.busy = true;
  if (!sendMessage(action)) {
    state.busy = false;
    showToast('连接还没准备好，再点一次试试。');
    return;
  }
  armBusyTimeout();
}

function joinRoom() {
  if (state.busy) return;

  const code = normalizeCodeInput(state.joinDraft);
  if (!isValidCode(code)) {
    state.joinError = '房间码是 6 位字母或数字，再看一眼？';
    setFocusAfterRender('joinCode');
    render();
    return;
  }

  state.joinError = '';
  state.joinDraft = code;
  const action = { type: 'join', code };

  if (!isSocketOpen()) {
    state.pendingAction = action;
    showToast('正在连接房间服务器…');
    connectSocket(true);
    render();
    return;
  }

  state.busy = true;
  if (!sendMessage(action)) {
    state.busy = false;
    showToast('连接还没准备好，再点一次试试。');
    return;
  }
  armBusyTimeout();
}

function submitWord(rawWord) {
  if (state.busy) return;

  const word = cleanWord(rawWord);
  if (!word) {
    showToast('先写一个词吧，哪怕只有一个字。');
    setFocusAfterRender('wordInput');
    focusAfterRender();
    return;
  }

  if (charLength(word) > MAX_WORD_LENGTH) {
    showToast('这个词有点长，最多 ' + MAX_WORD_LENGTH + ' 个字。');
    setFocusAfterRender('wordInput');
    focusAfterRender();
    return;
  }

  if (!isSocketOpen()) {
    showToast('连接断开啦，正在自动重连，稍等一下。');
    connectSocket();
    return;
  }

  const room = state.room;
  if (!room || !room.current || room.status !== 'playing') {
    showToast('这一局还没准备好，稍等一下。');
    return;
  }

  if (room.current.mySubmitted) {
    showToast('这个词已经藏好啦。');
    return;
  }

  state.busy = true;
  state.lastAction = 'submit';
  if (!sendMessage({
    type: 'submit',
    round: room.current.round,
    word
  })) {
    clearBusy();
    state.lastAction = '';
    showToast('消息没能送出去，再试一次吧。');
    connectSocket();
    return;
  }
  armBusyTimeout();
}

function castVote(choice, expectedRound) {
  if (state.busy) return;
  if (choice !== 'yes' && choice !== 'no') return;

  if (!isSocketOpen()) {
    showToast('连接断开啦，正在自动重连，稍等一下。');
    connectSocket();
    return;
  }

  const room = state.room;
  if (!room || !room.current) return;

  state.busy = true;
  state.lastAction = 'vote';
  if (!sendMessage({
    type: 'vote',
    round: Number(expectedRound) || room.current.round,
    choice
  })) {
    clearBusy();
    state.lastAction = '';
    showToast('消息没能送出去，再试一次吧。');
    connectSocket();
    return;
  }
  armBusyTimeout();
}

function requestRematch() {
  if (state.busy) return;

  if (!isSocketOpen()) {
    showToast('连接断开啦，正在自动重连，稍等一下。');
    connectSocket();
    return;
  }

  if (!state.room || state.room.status !== 'success') return;
  if (state.room.rematch && state.room.rematch.you) {
    showToast('已经发起啦，等 TA 也点一下。');
    return;
  }

  state.busy = true;
  state.lastAction = 'rematch';
  if (!sendMessage({ type: 'rematch' })) {
    clearBusy();
    state.lastAction = '';
    showToast('消息没能送出去，再试一次吧。');
    connectSocket();
    return;
  }
  armBusyTimeout();
}

function requestExit() {
  if (!state.room) return;

  openConfirm({
    title: '要离开这间小屋吗？',
    message: '离开后，这间房间会为你们关掉，TA 也会收到提示。',
    confirmLabel: '确认离开',
    onConfirm: function () {
      if (isSocketOpen()) {
        sendMessage({ type: 'leave' });
      }
      clearStoredCredentials();
      state.credentials = null;
      state.room = null;
      state.mode = 'home';
      state.joinDraft = '';
      state.joinError = '';
      state.joinHint = '';
      state.wordDraft = '';
      state.draftRound = 0;
      state.lastAction = '';
      state.missingTitle = '';
      state.missingMessage = '';
      state.dismissedSuccessKey = '';
      state.screenKey = '';
      clearBusy();
      clearRoomInUrl();
      if (successDialog.open) successDialog.close();
      render();
      showToast('小屋关灯啦，下次再见。');
    }
  });
}

function goHome() {
  clearStoredCredentials();
  state.credentials = null;
  state.room = null;
  state.mode = 'home';
  state.joinDraft = '';
  state.joinError = '';
  state.joinHint = '';
  state.wordDraft = '';
  state.draftRound = 0;
  state.missingTitle = '';
  state.missingMessage = '';
  state.dismissedSuccessKey = '';
  state.noReconnect = false;
  state.pendingAction = null;
  state.lastAction = '';
  clearBusy();
  clearRoomInUrl();
  if (successDialog.open) successDialog.close();
  render();
  if (!isSocketOpen()) connectSocket(true);
}

function openJoin() {
  state.mode = 'join';
  state.joinDraft = '';
  state.joinError = '';
  state.joinHint = '';
  clearRoomInUrl();
  render();
}

function abandonRestore() {
  clearStoredCredentials();
  state.credentials = null;
  state.mode = 'home';
  state.room = null;
  state.joinDraft = '';
  state.joinError = '';
  state.noReconnect = false;
  clearRoomInUrl();
  render();
  if (!isSocketOpen()) connectSocket(true);
}

/* ============================================================
   7. 复制 / 分享
   ============================================================ */
function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.setAttribute('readonly', '');
  textarea.style.position = 'fixed';
  textarea.style.top = '-9999px';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  textarea.setSelectionRange(0, textarea.value.length);
  let success = false;
  try {
    success = document.execCommand('copy');
  } finally {
    document.body.removeChild(textarea);
  }
  if (!success) throw new Error('copy failed');
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      fallbackCopy(text);
    }
    showToast('复制好啦。');
  } catch (error) {
    try {
      fallbackCopy(text);
      showToast('复制好啦。');
    } catch (fallbackError) {
      showToast('复制没成功，长按文字手动复制一下吧。');
    }
  }
}

/* ============================================================
   8. 游戏视图辅助
   ============================================================ */
function currentPair(room) {
  if (!room || !room.current) {
    return { myWord: '', partnerWord: '', both: false };
  }
  return {
    myWord: room.current.myWord || '',
    partnerWord: room.current.partnerWord || '',
    both: Boolean(room.current.bothSubmitted)
  };
}

function finalEntry(room) {
  if (!room || !Array.isArray(room.history) || !room.history.length) return null;
  return room.history[room.history.length - 1];
}

function resultMeta(result) {
  if (result === 'exact') {
    return {
      label: '一模一样',
      className: 'is-exact',
      note: '完全相同的两个词，直接相遇。'
    };
  }
  if (result === 'synonym') {
    return {
      label: '心意相通',
      className: 'is-synonym',
      note: '两个人都觉得是同义，就此相遇。'
    };
  }
  return {
    label: '继续联想',
    className: 'is-continue',
    note: '这一轮没有同义，带着这两个词继续。'
  };
}

function voteSummary(entry) {
  if (!entry || entry.result === 'exact') return '';
  const labels = { yes: '是', no: '否' };
  if (entry.result === 'synonym') return '同义投票 · 你们都选了「是」';
  const mine = entry.votes.you ? labels[entry.votes.you] : '还没选';
  const theirs = entry.votes.ta ? labels[entry.votes.ta] : '还没选';
  return '同义投票 · 你：' + mine + ' / TA：' + theirs;
}

function historyListMarkup(room, options) {
  const config = options || {};
  const entries = Array.isArray(room.history) ? room.history : [];

  if (!entries.length) {
    return [
      '<div class="history-empty">',
      '  <div class="history-empty-art" aria-hidden="true"><span></span></div>',
      '  <p>' + esc(config.emptyCopy || '联想链还空着，第一轮写下第一个词吧。') + '</p>',
      '</div>'
    ].join('');
  }

  const items = entries.map(function (entry, index) {
    const meta = resultMeta(entry.result);
    const votes = voteSummary(entry);
    const isFinal = index === entries.length - 1;
    const finalClass = config.markFinal && isFinal ? ' is-final' : '';

    return [
      '<li class="history-item ' + meta.className + finalClass + '">',
      '  <div class="history-head">',
      '    <span class="history-round">第 ' + entry.round + ' 轮</span>',
      '    <span class="result-tag ' + meta.className + '">' + meta.label + '</span>',
      '  </div>',
      '  <div class="history-pair">',
      '    <span class="history-word"><i>你</i>' + esc(entry.words[0].word) + '</span>',
      '    <span class="history-x">×</span>',
      '    <span class="history-word"><i>TA</i>' + esc(entry.words[1].word) + '</span>',
      '  </div>',
      '  <p class="history-note">' + esc(meta.note) + '</p>',
      votes ? '  <p class="history-votes">' + esc(votes) + '</p>' : '',
      '</li>'
    ].join('');
  }).join('');

  return '<ol class="history-list' + (config.full ? ' is-full' : '') + '">' + items + '</ol>';
}

function rematchInfo(room) {
  const rematch = room && room.rematch ? room.rematch : { you: false, ta: false };
  if (rematch.you) {
    return {
      mine: true,
      theirs: Boolean(rematch.ta),
      label: '等 TA 也点一下',
      hint: '你已经发起啦。TA 那边会实时看到，你们就重新开始。'
    };
  }
  if (rematch.ta) {
    return {
      mine: false,
      theirs: true,
      label: '我也要再来一局',
      hint: 'TA 已经在等你了，点一下就能重新开始这一局。'
    };
  }
  return {
    mine: false,
    theirs: false,
    label: '再来一局',
    hint: '两个人都点一下「再来一局」，新的一局才会开始。'
  };
}

function successKey(room) {
  if (!room || room.status !== 'success') return '';
  const entry = finalEntry(room);
  if (!entry) return room.code + ':success';
  return room.code + ':' + entry.round + ':' + entry.endedAt;
}

function successDescription(room, entry) {
  if (!entry) return '两个词刚好撞在一起，这就是默契吧。';
  if (entry.result === 'exact') {
    if (entry.round === 1) {
      return '第一轮就写下了同一个词。这份默契，有点犯规。';
    }
    return '第 ' + entry.round + ' 轮，你们写下了同一个词。所有绕路，都通向了这里。';
  }
  return '第 ' + entry.round + ' 轮，你们都说这两个词是同义。说法不同，心意靠得很近。';
}

function phaseHeadline(room, pair, isVote) {
  if (isVote) return '你们的词，见面啦。';
  if (pair.myWord || (room.current && room.current.mySubmitted)) return '藏好啦，等 TA 也来。';
  if (room.current && room.current.round === 1) return '先把第一个词，轻轻放进来。';
  return '顺着上一轮的词，再走一步。';
}

function phaseDescription(room, pair, isVote) {
  if (isVote) return '同时揭晓，不偏不倚。看看它们是不是同一个意思。';
  if (pair.myWord || (room.current && room.current.mySubmitted)) {
    return '你的词已经交给服务器藏好。TA 提交后会实时揭晓。';
  }
  if (room.current && room.current.round === 1) {
    return '不商量，不暗示。写下此刻最先浮上心头的那个词。';
  }
  return '看着上一轮的两个词，凭第一直觉写一个新词。';
}

function phaseCardTitle(room, pair) {
  if (pair.myWord || (room.current && room.current.mySubmitted)) return '等 TA 也写下一个词';
  if (room.current && room.current.round === 1) return '写下第一个词';
  return '再写一个新词';
}

function statusRowMarkup(room) {
  const current = room.current || {};
  const mineSubmitted = Boolean(current.mySubmitted);
  const partnerSubmitted = Boolean(current.partnerSubmitted);
  const partnerOnline = Boolean(room.partnerConnected);

  let partnerText = '还没提交';
  if (partnerSubmitted) partnerText = '已提交';
  else if (!partnerOnline) partnerText = '暂时离线';
  else if (mineSubmitted) partnerText = '等待对方提交';

  return [
    '<div class="status-row" aria-live="polite">',
    '  <div class="p-status' + (mineSubmitted ? ' is-done' : '') + '">',
    '    <span class="mini-avatar" aria-hidden="true">你</span>',

    '    <span class="status-light" aria-hidden="true"></span>',
    '  </div>',
    '  <div class="p-status' + (partnerSubmitted ? ' is-done' : '') + (partnerOnline ? '' : ' is-offline') + '">',
    '    <span class="mini-avatar mini-avatar--partner" aria-hidden="true">TA</span>',
    '    <span class="status-copy"><span>TA</span><b>' + partnerText + '</b></span>',
    '    <span class="status-light" aria-hidden="true"></span>',
    '  </div>',
    '</div>'
  ].join('');

function baseStripMarkup(room) {
  const base = room.current && Array.isArray(room.current.base) ? room.current.base : [];
  if (base.length < 2) return '';
  return [
    '<div class="seed-strip">',
    '  <span class="seed-label">从上一轮出发</span>',
    '  <div class="seed-pair">',
    base.map(function (item, index) {
      return (index ? '<span class="seed-x" aria-hidden="true">×</span>' : '') +
        '<span class="seed-word"><i>' + esc(item.role) + '</i>' + esc(item.word) + '</span>';
    }).join(''),
    '  </div>',
    '  <p class="seed-note">不用刻意相关，顺着脑海里第一个冒出来的词就好。</p>',
    '</div>'
  ].join('');
}

function inputAreaMarkup(room) {
  const current = room.current;
  const draft = state.draftRound === current.round ? state.wordDraft : '';
  const draftLength = charLength(draft);

  if (current.mySubmitted) {
    return [
      '<div class="sealed-state">',
      '  <span class="sealed-icon" aria-hidden="true">✦</span>',
      '  <h2>你的词，已经藏好啦</h2>',

  return [
    baseStripMarkup(room),
    '<form class="word-form" data-form="word" novalidate>',

    '    <input class="word-input" id="wordInput" name="word" type="text" maxlength="48" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="写下此刻想到的词…" value="' + esc(draft) + '" data-round="' + current.round + '" aria-describedby="wordHint">',

    '  </div>',

    '</form>',
    '<p class="privacy-line">第 ' + current.round + ' 轮 · 在两边都提交之前，谁都看不到对方的词。</p>'
  ].join('');
}

function revealMarkup(room, pair) {
  const current = room.current;
  const myVote = current.myVote || '';
  const partnerVoted = Boolean(current.partnerVoted);
  const canVote = state.connection === 'online' && !myVote;

  let voteText = '不用商量，凭第一感觉选就好。';
  if (state.connection !== 'online') {
    voteText = '连接断开啦，重连成功后就可以继续。';
  } else if (myVote) {
    voteText = '你选了「' + (myVote === 'yes' ? '是' : '否') + '」 · 等 TA 也做决定。';
  } else if (partnerVoted) {
    voteText = 'TA 已经悄悄选好了，轮到你啦。';
  }

  return [
    '<div class="card reveal-card">',
    '  <div class="reveal-head">',
    '    <span class="round-pill">第 ' + current.round + ' 轮 · 同时揭晓</span>',

    '    <div class="reveal-word reveal-word--partner"><span class="word-who">TA</span><strong>' + esc(pair.partnerWord) + '</strong></div>',
    '  </div>',

    '  <h2>这两个词，算同义吗？</h2>',

    '  <div class="vote-actions">',
    '    <button type="button" class="btn btn-sage" data-action="vote" data-vote="yes" data-round="' + current.round + '"' + (canVote ? '' : ' disabled') + '>是，它们心意相通</button>',
